name: deepin-icon-theme
version: 2026.02.27
release: 17
source:
- https://github.com/linuxdeepin/deepin-icon-theme/archive/refs/tags/2026.02.27.tar.gz: e4c9470d3f4f2064ff89eeafc3cc105f16ec1eddd8a97d75580639a21e115505
homepage: https://github.com/linuxdeepin/deepin-icon-theme
license: GPL-3.0-or-later
summary:
- Standard Deepin icon theme
- bloom: Deepin bloom icon theme
- bloom-dark: Deepin bloom icon theme
- dark: Deepin dark icon theme
- sea: Deepin Sea icon theme
description: 'Icons from the Deepin Desktop Environment

  '
component: desktop.theme
category: other
builddeps:
- xcursorgen
rundeps:
- bloom-dark: deepin-icon-theme
- dark: deepin-icon-theme
- deepin-icon-theme-bloom
- sea: deepin-icon-theme
setup: 'sed -i -e ''s|bloom-classic|deepin|g'' */index.theme

  %patch -p1 -i $pkgfiles/0001-Fix-Makefile.patch

  '
build: '%make

  '
install: "%make_install\n\n# Add icons for our Software Center\npushd $installdir/usr/share/icons\nfor theme in bloom deepin\
  \ ; do\n    cd ${theme}\n    for sc in 16 24 32 48 64 96 128 256 512 ; do\n        if [ -d \"apps/${sc}\" ] ; then\n   \
  \          ln -sv deepin-app-store.svg apps/${sc}/system-software-install.svg\n        fi\n    done\n    cd ..\ndone\npopd\n\
  \n# Remove broken icons and make symbolic links\npushd $installdir/usr/share/icons\nrm bloom/apps/48/{calibre-gui.svg,galculator.svg,texmacs.svg,vim.svg}\n\
  rm deepin/apps/48/{calibre-gui.svg,galculator.svg,libreoffice-*.svg,vim.svg}\nrm Sea/apps/scalable/{calibre-gui.svg,galculator.svg,libreoffice-*.svg,vim.svg}\n\
  for theme in bloom bloom-dark; do    \ncd ${theme}\nrm places/16/folder-symbolic.svg\nln -sv folder-downloads-symbolic.svg\
  \ places/16/folder-download-symbolic.svg\ncd ..\ndone\n"
patterns:
- bloom: /usr/share/icons/bloom
- bloom-dark: /usr/share/icons/bloom-dark
- dark: /usr/share/icons/deepin-dark
- sea: /usr/share/icons/Sea
